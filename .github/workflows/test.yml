name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Windows runners often inherit core.autocrlf=true; keep repository LF
          # so markdown fence parsers and path fixtures stay hermetic.
          core.autocrlf: false
      - uses: oven-sh/setup-bun@v2
      - name: Install ripgrep
        # pi's grep tool downloads rg on first use when it is absent; on shared
        # runners that ad-hoc GitHub Releases download is rate-limited, so
        # provision rg on PATH up front to keep nested-grep tests hermetic.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
          else
            sudo apt-get install -y ripgrep
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Test Windows type-checker regression
        if: runner.os == 'Windows'
        run: bunx vitest run tests/type-checker.test.ts
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: Lint (dead code)
        run: bun run lint:dead
